{% extends 'layout.html' %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card error-card">
    <div class="auth-panel auth-panel--form">
      <p class="eyebrow">AURA / {{ code }}</p>
      <h1>{{ code }}</h1>
      <p class="muted">{{ message }}</p>
      <a class="btn-primary" href="{{ url_for('home') }}">Return home</a>
    </div>
  </div>
</section>
{% endblock %}
